name: Build & Deploy UdemyTAG to GitHub Pages

on:
  schedule:
    - cron: '0 */3 * * *' # Berjalan otomatis setiap 3 jam untuk verifikasi kuota berkala
  workflow_dispatch:      # Mengaktifkan tombol "Run workflow" di tab Actions GitHub (sinkronisasi instan)
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Data from Google Sheets
        run: node scripts/fetch-sheets.mjs
        env:
          SHEETS_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1TQLqIVYPmLukrWrDFt4yOboFw3EzwNP8XHdy7oZDYfm07c6TYmhndgGWeK-ECyySkcXfXjG3IROR/pub?gid=949957534&single=true&output=csv"

      - name: Build Static Site (Astro)
        run: npm run build

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "Automated Deploy: Refresh courses from Google Sheets [skip ci]"

      - name: Ping Search Engines & AI Bots via IndexNow
        run: node scripts/submit-indexnow.mjs
